<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap');
/* Layout idea: dark navy sidebar for navigation and reference material, light workspace with dense tables, one detail drawer, and a floating workflow guide. */
:root{
  --bg:#f4f6fa;--surface:#ffffff;--surface2:#edf1f7;--ink:#121c2e;--muted:#5a6a82;--line:#dce3ee;
  --accent:#2e55d8;--accent-soft:#e4ebfd;--accent-ink:#ffffff;
  --side:#0f1a2e;--side-ink:#b9c4d8;--side-act:#1d2c4a;
  --ok:#16794a;--ok-soft:#dff3e8;--warn:#955700;--warn-soft:#fcefd3;--crit:#b82f2a;--crit-soft:#fbe1df;
  --shadow:0 1px 2px rgba(18,28,46,.05),0 4px 16px rgba(18,28,46,.06);
  --f-display:'Instrument Sans',system-ui,sans-serif;--f-body:'Instrument Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1120;--surface:#101a2e;--surface2:#17233b;--ink:#e8eefb;--muted:#93a2bd;--line:#223253;
    --accent:#7b9bff;--accent-soft:#1a2850;--accent-ink:#0a1120;--side:#070d19;--side-ink:#9fb0cc;--side-act:#14213d;
    --ok:#52cf8f;--ok-soft:#12352a;--warn:#f2b04a;--warn-soft:#3b2c0f;--crit:#ff8079;--crit-soft:#3e1b1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1120;--surface:#101a2e;--surface2:#17233b;--ink:#e8eefb;--muted:#93a2bd;--line:#223253;
  --accent:#7b9bff;--accent-soft:#1a2850;--accent-ink:#0a1120;--side:#070d19;--side-ink:#9fb0cc;--side-act:#14213d;
  --ok:#52cf8f;--ok-soft:#12352a;--warn:#f2b04a;--warn-soft:#3b2c0f;--crit:#ff8079;--crit-soft:#3e1b1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.012em;font-weight:650}
h1{font-size:24px}h2{font-size:19px}h3{font-size:15.5px}h4{font-size:13.5px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small,.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.ico{flex:none}
 
/* shell */
.shell{display:grid;grid-template-columns:244px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;color:#fff;font:700 18px var(--f-display)}
.brand small{display:block;color:var(--side-ink);font:400 11.5px var(--f-body);line-height:1.2}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.navsec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6f819f;padding:12px 10px 4px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-ink);padding:9px 10px;border-radius:9px;text-align:left;font-weight:500}
.ni:hover{background:var(--side-act);color:#fff}
.ni[aria-current="page"]{background:var(--side-act);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.ni .badge{margin-left:auto}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font:600 11px var(--f-mono);padding:1px 7px;min-width:20px;text-align:center}
.badge.red{background:var(--crit);color:#fff}
.badge.soft{background:var(--surface2);color:var(--muted)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.rolecard{background:var(--side-act);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.rolecard .who{display:flex;gap:10px;align-items:center;color:#fff}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.rolecard select{background:#0f1a2e;border:1px solid #2b3d60;border-radius:8px;color:#fff;padding:6px 8px;width:100%}
.assess{font-size:11.5px;line-height:1.35;color:#7d8fae;padding:0 4px}
.mainc{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.crumb b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.gs{position:relative}
.gs input{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px 8px 34px;width:260px}
.gs .ico{position:absolute;left:10px;top:9px;color:var(--muted)}
.gsr{position:absolute;top:42px;left:0;width:340px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30}
.gsr button{display:flex;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:8px;text-align:left;align-items:center}
.gsr button:hover{background:var(--surface2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface2);font-size:13px;white-space:nowrap}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn .badge{position:absolute;top:-6px;right:-6px}
.pop{position:absolute;right:0;top:46px;width:min(380px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.22);z-index:35;padding:8px;max-height:70vh;overflow:auto}
.pop h4{padding:8px 10px;color:var(--muted)}
.alert{display:flex;gap:10px;padding:10px;border-radius:10px;width:100%;border:0;background:none;text-align:left}
.alert:hover{background:var(--surface2)}
.alert .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.dot.crit{background:var(--crit)}.dot.warn{background:var(--warn)}.dot.info{background:var(--accent)}
main{padding:22px 24px 90px;max-width:1360px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pagehead p{color:var(--muted);margin-top:3px;max-width:70ch}
 
/* buttons, pills */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:550;display:inline-flex;align-items:center;gap:7px;transition:background .12s}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.fever,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.eligible,.pill.approved,.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.pending{background:var(--surface2);color:var(--muted)}
.role-chip{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--accent-soft);color:var(--accent)}
 
/* kpi + panels */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .n{font:600 27px/1.15 var(--f-mono);margin-top:3px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.crit .n{color:var(--crit)}.kpi.ok .n{color:var(--ok)}.kpi.warn .n{color:var(--warn)}.kpi.acc .n{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.panel>h3,.panel>.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;font-size:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:230px}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
 
/* tables */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl tr.rowcrit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.tbl tr.rowfever td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.tbl tr.rowok td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.tbl tr.roweligible td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl td.num,.tbl th.num{text-align:right}
.tbl .nm b{display:block;line-height:1.25}
.room{font:600 13px var(--f-mono);background:var(--surface2);border-radius:8px;padding:5px 8px;min-width:46px;text-align:center;display:inline-block}
.temp{font:600 17px/1 var(--f-mono)}
.temp.crit{color:var(--crit)}.temp.fever{color:var(--warn)}.temp.ok{color:var(--ok)}.temp.none{color:var(--muted)}
.pips{display:inline-flex;gap:4px;align-items:center}
.pip{width:11px;height:11px;border-radius:50%;border:2px solid var(--line)}
.pip.on{background:var(--ok);border-color:var(--ok)}
.task{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.task.done{background:var(--ok-soft);color:var(--ok)}
.spark{display:block}
.spark .l{stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linejoin:round}
.spark .t{stroke:var(--warn);stroke-dasharray:2 2;stroke-width:1}
.spark circle{fill:var(--accent)}.spark circle.f{fill:var(--warn)}.spark circle.c{fill:var(--crit)}
 
/* kanban */
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.col{background:var(--surface2);border-radius:14px;padding:10px;min-height:120px}
.col>header{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.col .list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 360px);min-height:100px;overflow:auto;padding:2px}
.mini{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.mini:hover{border-color:var(--accent)}
.mini.crit{border-left-color:var(--crit)}.mini.fever{border-left-color:var(--warn)}.mini.ok{border-left-color:var(--ok)}.mini.eligible{border-left-color:var(--accent)}
.mini.locked{opacity:.8;border-style:dashed}
.mini .grow{flex:1;min-width:0}
.mini .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockmsg{font-size:12px;color:var(--muted)}
 
/* rows, bars, banners */
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block}
.bar-track{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar-fill.ok{background:var(--ok)}.bar-fill.warn{background:var(--warn)}
.prog{margin-bottom:14px}.prog .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner b{display:block}.banner span{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.rt{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 4px;text-align:center;line-height:1.15}
button.rt{cursor:pointer}
.rt b{display:block;font:600 14px var(--f-mono)}
.rt span{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt.crit{background:var(--crit-soft);border-color:var(--crit)}
.rt.fever{background:var(--warn-soft);border-color:var(--warn)}
.rt.ok{background:var(--ok-soft);border-color:var(--ok)}
.rt.eligible,.rt.approved{background:var(--accent-soft);border-color:var(--accent)}
.rt.free{border-style:dashed;background:transparent}
.rt.cleaning{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 5px,var(--surface) 5px,var(--surface) 10px);border-style:dashed}
.lg-crit{background:var(--crit)}.lg-fever{background:var(--warn)}.lg-ok{background:var(--ok)}.lg-eligible,.lg-approved{background:var(--accent)}.lg-pending{background:var(--line)}.lg-clean{background:var(--muted)}
.log{max-height:320px;overflow:auto;font-size:13.5px}
.log div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.log time{font:12px var(--f-mono);color:var(--muted);min-width:46px}
 
/* drawer, modal, forms */
.scrim{position:fixed;inset:0;background:rgba(6,14,28,.5);z-index:40;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(560px,100%);height:100%;background:var(--bg);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:-10px 0 30px rgba(0,0,0,.25)}
.modal{width:min(480px,100%);background:var(--surface);border-radius:16px;padding:20px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal h3{font-size:19px;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.tin{font:600 30px var(--f-mono)!important;max-width:180px}
.fb{border-radius:10px;padding:9px 12px;font-size:13.5px;margin:8px 0}
.fb.err{background:var(--crit-soft);color:var(--crit)}.fb.warn{background:var(--warn-soft);color:var(--warn)}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.info{background:var(--accent-soft);color:var(--accent)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:8px 0}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.dhead{display:flex;gap:12px;align-items:center}
.dhead h2{line-height:1.15}
.xbtn{margin-left:auto}
.wf{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wf>div{flex:1;padding:10px 12px;border-right:1px solid var(--line);font-size:12.5px;min-width:0}
.wf>div:last-child{border-right:0}
.wf b{display:block;font-size:13.5px;margin-top:2px}
.wf .done{background:var(--ok-soft)}.wf .now{background:var(--accent-soft)}.wf .lock{background:var(--surface2);color:var(--muted)}
.wf small{display:block;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px}
.tl-i{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl-i:last-child{border-bottom:0}
.tl-i time{font:12px var(--f-mono);color:var(--muted);min-width:92px;padding-top:2px}
.tl-i.void{opacity:.5;text-decoration:line-through}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10.5px var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .thr{stroke:var(--warn);stroke-dasharray:4 3;stroke-width:1.4}
.chart .crt{stroke:var(--crit);stroke-dasharray:2 3;stroke-width:1.2}
.chart .ln{stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linejoin:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.f{stroke:var(--warn)}.chart .dot.c{stroke:var(--crit);fill:var(--crit)}
 
/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login .l{background:var(--side);color:#fff;padding:48px 44px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.login .l h1{font-size:clamp(30px,4vw,42px);line-height:1.08;color:#fff}
.login .l p{color:var(--side-ink);max-width:50ch}
.login .r{padding:44px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.role{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.role:hover{border-color:var(--accent)}
.role .avatar{width:40px;height:40px;border-radius:11px}
.role b{display:block}
.steps4{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.steps4 div{display:flex;gap:12px;align-items:center;color:var(--side-ink);font-size:14px}
.steps4 i{font:600 12px var(--f-mono);font-style:normal;background:var(--side-act);color:#fff;border-radius:7px;width:26px;height:26px;display:grid;place-items:center}
 
/* workflow guide + dock */
.gl{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.fl{display:flex;flex-direction:column;gap:8px}
.fcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.fcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fcard b{font-size:14px}.fcard small{font-size:12.5px}
.stp{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stp:last-child{border-bottom:0}
.stp .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 12px var(--f-mono);flex:none;color:var(--muted)}
.stp.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.cur .n{border-color:var(--accent);color:var(--accent)}
.stp .b{flex:1;min-width:0}
.stp .b b{display:block}
.stp .r{color:var(--muted);font-size:13px}
.dock{position:fixed;right:16px;bottom:16px;width:min(360px,calc(100% - 32px));background:var(--surface);border:1px solid var(--accent);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.28);z-index:45;overflow:hidden}
.dock header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--accent);color:var(--accent-ink)}
.dock header b{flex:1;font-size:13.5px}
.dock header button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:7px;padding:2px 8px}
.dock .bd{padding:6px 12px 12px;max-height:46vh;overflow:auto}
.dock .stp{padding:8px 0;font-size:13.5px}
 
.drawer-open .dock{right:auto;left:260px}
@media (max-width:980px){.drawer-open .dock{display:none}}
/* reference pages */
.xs{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
table.t td.c,table.t th.c{text-align:center}
.sel-row{background:var(--ok-soft)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.diag{width:100%;height:auto;display:block}
.diag text{fill:var(--ink);font:12px var(--f-body)}
.diag .lane{fill:var(--surface2)}
.diag .lane.alt{fill:transparent}
.diag .lt{fill:var(--muted);font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em}
.diag rect.bx{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.diag rect.bx.sys{stroke:var(--muted);stroke-dasharray:4 3}
.diag rect.bx.bad{stroke:var(--crit)}
.diag rect.bx.good{stroke:var(--ok)}
.diag path.ar{fill:none;stroke:var(--muted);stroke-width:1.5}
.diag path.ar.dash{stroke-dasharray:4 3}
.diag .lb{fill:var(--muted);font:11px var(--f-body)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface2);color:var(--muted)}
.tag.must{background:var(--crit-soft);color:var(--crit)}.tag.should{background:var(--warn-soft);color:var(--warn)}.tag.could{background:var(--accent-soft);color:var(--accent)}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);width:100%}
.toast.warn{background:var(--warn);color:#fff}.toast.crit{background:var(--crit);color:#fff}
 
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .brand{padding:0 8px 0 0}.navsec,.assess{display:none}
  .ni{width:auto;padding:7px 10px}
  .sidefoot{margin:0 0 0 auto;padding:0}.rolecard .who{display:none}.rolecard{padding:4px;background:none}
  .login{grid-template-columns:1fr}.login .l,.login .r{padding:28px 20px}
  .kan{grid-template-columns:1fr}.gl{grid-template-columns:1fr}
  .top{padding:10px 16px}main{padding:16px 16px 90px}.gs input{width:100%}.gs{flex:1;min-width:180px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.demotag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin:0 0 4px}
.demonote{display:block;font-size:11px;opacity:.7;margin-top:4px;line-height:1.35}
.simtag{display:inline-block;margin:10px 0 0;background:#fff1cc;color:#6b4e00;border:1px solid #f0d58a;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}

/* ===== Orange / black 3D theme (visual layer only; no logic changes) ===== */
:root:root:root:root{
  --bg:#09090b;--surface:#18181c;--surface2:#212127;--ink:#f6efe7;--muted:#a29a90;--line:#32323a;
  --accent:#ff7a1a;--accent-soft:rgba(255,122,26,.17);--accent-ink:#1a0a00;
  --side:#050506;--side-ink:#bcb2a6;--side-act:#23190f;
  --ok:#3ddc84;--ok-soft:rgba(61,220,132,.14);--warn:#ffc233;--warn-soft:rgba(255,194,51,.14);--crit:#ff5252;--crit-soft:rgba(255,82,82,.17);
  --shadow:0 1px 0 rgba(255,255,255,.07) inset,0 -1px 0 rgba(0,0,0,.7) inset,0 3px 0 #060607,0 14px 26px -10px rgba(0,0,0,.9);
  --f-display:'Space Grotesk','Instrument Sans',system-ui,sans-serif;
  color-scheme:dark;
}
body{background:
  radial-gradient(900px 520px at 85% -8%,rgba(255,122,26,.16),transparent 62%),
  radial-gradient(700px 480px at -8% 108%,rgba(255,90,0,.09),transparent 60%),
  linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px) 0 0/44px 44px,
  #09090b;background-attachment:fixed}
h1,h2,h3{font-weight:700;letter-spacing:-.02em}
h1,h2{text-shadow:0 2px 0 rgba(0,0,0,.6)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#0c0c0e}::-webkit-scrollbar-thumb{background:#3a3a42;border-radius:8px;border:2px solid #0c0c0e}
::selection{background:var(--accent);color:#1a0a00}
 
/* raised surfaces */
.panel,.kpi,.col,.pop,.fcard,.role,.wf,.dock,.modal,.drawer,.login .r{
  background:linear-gradient(180deg,#202025 0%,#161619 100%);
  border:1px solid #34343c;
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 -1px 0 rgba(0,0,0,.65) inset,0 3px 0 #060607,0 16px 28px -12px rgba(0,0,0,.95)}
.col{background:linear-gradient(180deg,#141417,#0f0f12);box-shadow:0 2px 6px rgba(0,0,0,.7) inset,0 1px 0 rgba(255,255,255,.05)}
.drawer{border-radius:0;border-width:0 0 0 1px;background:linear-gradient(180deg,#131316,#0c0c0e)}
.login .r{background:transparent;border:0;box-shadow:none}
.panel{border-radius:16px}
.kpi{position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent)}
.kpi.crit::before{background:linear-gradient(90deg,var(--crit),transparent)}.kpi.ok::before{background:linear-gradient(90deg,var(--ok),transparent)}.kpi.warn::before{background:linear-gradient(90deg,var(--warn),transparent)}
.kpi .n{text-shadow:0 0 18px currentColor,0 3px 0 rgba(0,0,0,.6)}
.kpi:hover{transform:perspective(800px) translateY(-4px) rotateX(4deg);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 5px 0 #060607,0 24px 34px -12px rgba(0,0,0,1),0 0 0 1px rgba(255,122,26,.35)}
 
/* sidebar */
.side{background:linear-gradient(180deg,#0d0d0f,#040405);border-right:1px solid #26262c;box-shadow:6px 0 28px rgba(0,0,0,.7)}
.logo{background:linear-gradient(145deg,#ffa24d,#f26200);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -3px 0 rgba(120,40,0,.55) inset,0 4px 0 #a14000,0 10px 18px rgba(255,106,0,.4);color:#1a0a00}
.brand{text-shadow:0 2px 0 #000}
.navsec{color:#7e7468}
.ni{transition:transform .12s,background .12s}
.ni:hover{background:#1b1b1f;transform:translateX(3px)}
.ni[aria-current="page"]{background:linear-gradient(180deg,#ff8a2e,#ee6200);color:#1a0a00;font-weight:650;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 3px 0 #9b3d00,0 10px 18px -6px rgba(255,106,0,.55)}
.ni[aria-current="page"] .ico{color:#1a0a00}

.rolecard{background:linear-gradient(180deg,#1d1914,#120f0c);border:1px solid #3a2a1c;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 3px 0 #040404,0 12px 20px -8px #000}
.rolecard select{background:#0b0b0d;border:1px solid #3a3a42;box-shadow:0 2px 5px rgba(0,0,0,.7) inset}
.avatar{background:linear-gradient(145deg,#ffa24d,#f26200);color:#1a0a00;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 0 #9b3d00,0 6px 10px rgba(0,0,0,.5)}
 
/* top bar */
.top{background:rgba(12,12,14,.82);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid #2a2a30;box-shadow:0 10px 24px -10px rgba(0,0,0,.9)}
.gs input,.field input,.field select,.field textarea,.search,select.sel{background:#0b0b0d;border:1px solid #34343c;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.75) inset}
.gs input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.75) inset,0 0 0 3px rgba(255,122,26,.25)}
option{background:#121215;color:var(--ink)}
.chip{background:linear-gradient(180deg,#26262c,#1b1b20);border:1px solid #34343c;box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 2px 0 #060607}

.pop,.gsr{background:#141417;border-color:#3a3a42;box-shadow:0 24px 50px rgba(0,0,0,.9)}
 
/* buttons: physical keys */
.btn{background:linear-gradient(180deg,#2c2c33,#1c1c21);border:1px solid #3d3d46;color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 3px 0 #08080a,0 8px 12px -4px rgba(0,0,0,.8);transition:transform .08s,box-shadow .08s,filter .12s;position:relative}

.btn.pri{background:linear-gradient(180deg,#ff9a40,#f06000);border-color:#ffb375;color:#1a0a00;font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 3px 0 #9b3d00,0 10px 20px -4px rgba(255,106,0,.5)}

.btn.ghost{background:none;box-shadow:none;border-color:transparent}

.seg{background:#0e0e11;border-color:#34343c;box-shadow:0 2px 6px rgba(0,0,0,.7) inset}

.pill{box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 2px 0 rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}

/* tables and rows */
.tbl th,table.t th{background:#1c1c21;color:#b7ada1}

<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="dock"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ASSUMED CLINICAL PARAMETERS. These are placeholders chosen for the prototype.
   They must be reviewed and approved by the head doctor before any real-world use. */
const FEVER = 38.0, CRIT = 39.5, LOW = 35.0, MINT = 34.0, MAXT = 42.0, NEED = 3, BENCH = 0.15, ROOMS = 74, MIN_SAMPLE = 30;
const BASE = new Date(2026, 10, 12);
const TREATMENTS = ['Continue supportive care','Antipyretic and hydration','IV fluids and close monitoring','Antiviral protocol','Escalate to intensive care','Other (see note)'];
const USERS = {
  nurse:{name:'Anita Rao',title:'Staff Nurse',letter:'N'},
  doctor:{name:'Dr. Arjun Mehta',title:'Attending Doctor',letter:'D'},
  head:{name:'Dr. Leela Iyer',title:'Head Doctor',letter:'H'},
  admin:{name:'Rohan Desai',title:'Admin Staff',letter:'A'}
};
const NAV = {
  nurse:[['rounds','Rounds'],['map','Ward map']],
  doctor:[['visits','Visit queue'],['signoff','Discharge sign-off'],['map','Ward map']],
  head:[['quality','Quality'],['visits','Visit queue'],['signoff','Discharge sign-off'],['map','Ward map']],
  admin:[['overview','Overview'],['map','Ward map'],['quality','Quality']]
};
const PERMS = {
  recordTemp:['nurse'], visit:['doctor','head'], approve:['doctor','head'], death:['doctor','head'],
  discharge:['admin'], admit:['admin'], clean:['admin']
};
 
let S = null;           // application state
const UI = {role:null, view:null, filter:'due', sort:'room', q:'', drawer:null, draft:{}, bell:false, auditF:'all', gf:'F1'};
const GUIDE = {on:false, feat:null, done:new Set(), min:false};
let onEmit = null;
function emit(e){ GUIDE.done.add(e); if (onEmit) onEmit(e); }
 
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dateOf = d => { const x = new Date(BASE); x.setDate(x.getDate() + d); return x; };
const fmtDate = (d, o) => dateOf(d).toLocaleDateString('en-IN', o || {day:'numeric', month:'short'});
const f1 = n => n.toFixed(1);
const toF = c => c * 9 / 5 + 32;
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
 
/* ---------- seed data ---------- */
function seedState(){
  const r = rng(11), pick = a => a[Math.floor(r() * a.length)];
  const first = ['Aarav','Diya','Vihaan','Ananya','Kabir','Meera','Rohan','Ishita','Arjun','Saanvi','Dev','Navya','Reyansh','Kiara','Yash','Tara','Aditya','Myra','Karan','Riya','Neil','Sara','Om','Pooja','Imran','Farah','Joseph','Maria','Gurpreet','Simran','Harsh','Nisha','Varun','Pallavi','Manav','Zoya','Ritvik','Anika','Sameer','Leena'];
  const last = ['Sharma','Patel','Nair','Iyer','Khan','Singh','Desai','Gupta','Menon','Joshi','Kulkarni','Reddy','Mehta','Verma','Shah','Pillai','Bose','Chopra','DSouza','Kapoor','Rao','Bhatt','Naik','Das','Malhotra'];
  const used = new Set();
  const mkName = () => { let n; do { n = pick(first) + ' ' + pick(last); } while (used.has(n)); used.add(n); return n; };
  const nurses = ['Anita Rao','Kavya Nair','Sunil Patil'], docs = ['Dr. Arjun Mehta','Dr. Leela Iyer'];
  const notes = ['Stable, tolerating fluids.','Fever persisting, hydration encouraged.','Responding to treatment.','Mild cough, no breathing difficulty.','Monitoring closely overnight.','Appetite improving.'];
  const types = [];
  for (let i = 0; i < 3; i++) types.push(5);
  for (let i = 0; i < 2; i++) types.push(4);
  for (let i = 0; i < 7; i++) types.push(3);
  for (let i = 0; i < 9; i++) types.push(2);
  for (let i = 0; i < 10; i++) types.push(1);
  while (types.length < ROOMS) types.push(0);
  for (let i = types.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [types[i], types[j]] = [types[j], types[i]]; }
  const feverTemp = (i, f) => Math.min(40.4, Math.max(38.1, 38.3 + 1.4 * Math.sin(Math.PI * (i + .5) / f) + (r() - .5) * .6));
  const clearTemp = () => 36.5 + r() * .8;
  const round1 = x => Math.round(x * 10) / 10;
  const patients = [];
  let approvedCount = 0;
  types.forEach((n, idx) => {
    const room = idx + 1, f = 3 + Math.floor(r() * 5);
    const k = n === 0 ? Math.floor(r() * f) : f + n;
    const p = {id:'P' + (1000 + room), name:mkName(), age:8 + Math.floor(r() * 72), sex:r() < .5 ? 'F' : 'M', room, admitDay:-k, status:'active', readings:[], visits:[]};
    for (let i = 0; i < k; i++) {
      const day = -k + i;
      p.readings.push({day, time:pad(6 + Math.floor(r() * 3)) + ':' + pad(Math.floor(r() * 60)), temp:round1(i < f ? feverTemp(i, f) : clearTemp()), by:pick(nurses)});
      p.visits.push({day, time:pad(10 + Math.floor(r() * 3)) + ':' + pad(Math.floor(r() * 60)), by:pick(docs), treatment:i < f ? pick(TREATMENTS.slice(0, 4)) : TREATMENTS[0], note:pick(notes)});
    }
    const measured = r() < (n >= 3 ? .12 : .62);
    const willApprove = n >= 4 || (n === 3 && approvedCount < 2);
    if (measured || willApprove) {
      p.readings.push({day:0, time:pad(6 + Math.floor(r() * 3)) + ':' + pad(Math.floor(r() * 60)), temp:round1(k < f ? feverTemp(k, f) : clearTemp()), by:pick(nurses)});
      if (r() < .5) p.visits.push({day:0, time:pad(10 + Math.floor(r() * 3)) + ':' + pad(Math.floor(r() * 60)), by:pick(docs), treatment:TREATMENTS[k < f ? 1 : 0], note:pick(notes)});
    }
    if (n >= 3) {
      p.eligibleDay = -(n - 3);   // eligible from the day after the 3rd full fever-free day ended
      if (willApprove) { p.status = 'approved'; p.approvedDay = Math.min(0, p.eligibleDay + (n > 3 ? 1 : 0)); if (n === 3) approvedCount++; }
    }
    patients.push(p);
  });
  const closed = [];
  const deadIdx = new Set();
  while (deadIdx.size < 13) deadIdx.add(Math.floor(r() * 87));
  for (let i = 0; i < 87; i++) closed.push({day:-30 + Math.floor(i * 30 / 87), outcome:deadIdx.has(i) ? 'deceased' : 'cured', delay:deadIdx.has(i) ? null : pick([0,0,1,1,1,2,0,1,3])});
  const waiting = [];
  for (let i = 0; i < 6; i++) waiting.push({id:'W' + i, name:mkName(), age:10 + Math.floor(r() * 65), sex:r() < .5 ? 'F' : 'M', since:pad(7 + i) + ':' + pad(Math.floor(r() * 60))});
  return {day:0, patients, closed, waiting, cleaning:{}, log:[
    {t:'06:45', m:'Nurse shift handover completed', role:'system'},
    {t:'07:10', m:'Room map synced: 74 of 74 rooms occupied', role:'system'},
    {t:'08:02', m:'Waiting list has 6 patients; no rooms free', role:'system'}
  ]};
}
 
/* ---------- domain logic ---------- */
const byId = id => S.patients.find(p => p.id === id);
const live = p => p.status === 'active' || p.status === 'approved';
const dayReadings = (p, d) => p.readings.filter(r => r.day === d && !r.voided);
const todayTemp = p => { const a = dayReadings(p, S.day); return a.length ? a[a.length - 1].temp : null; };
const todayReading = p => { const a = dayReadings(p, S.day); return a.length ? a[a.length - 1] : null; };
const lastReading = p => { const a = p.readings.filter(r => !r.voided); return a.length ? a[a.length - 1] : null; };
function dayStatus(p, d, readings){
  const a = (readings || p.readings).filter(r => r.day === d && !r.voided);
  if (!a.length) return null;
  return a.some(r => r.temp >= FEVER) ? 'fever' : 'clear';
}
/* A "full fever-free day" is a calendar day that has already ended, has at least one valid reading,
   and has no reading at or above the fever threshold. Today is never counted, because it is not complete.
   The count runs back from yesterday and stops at the first day that is missing or has a fever.
   A fever reading today also resets the count to 0 (the patient is febrile now). */
function streakCalc(p, readings, today){
  const rs = readings || p.readings;
  if (dayStatus(p, today, rs) === 'fever') return {count:0, last:today - 1, resetToday:true};
  let c = 0;
  for (let d = today - 1; d >= p.admitDay; d--) { if (dayStatus(p, d, rs) === 'clear') c++; else break; }
  return {count:c, last:today - 1, resetToday:false};
}
const streak = p => streakCalc(p, p.readings, S.day).count;
const eligible = p => p.status === 'active' && streak(p) >= NEED;
/* Sign-off needs the criterion above AND a non-fever reading today, so the doctor decides on current data. */
const canApprove = p => eligible(p) && todayTemp(p) !== null && todayTemp(p) < FEVER;
const visitToday = p => p.visits.find(v => v.day === S.day);
function pstate(p){
  if (p.status === 'approved') return {k:'approved', label:'Cleared for discharge'};
  const t = todayTemp(p);
  if (t !== null && t >= CRIT) return {k:'crit', label:'High fever'};
  if (t !== null && t >= FEVER) return {k:'fever', label:'Fever'};
  if (eligible(p)) return {k:'eligible', label:canApprove(p) ? 'Needs discharge sign-off' : 'Eligible, needs today\u2019s reading'};
  if (t === null) return {k:'pending', label:'Temperature due'};
  return {k:'ok', label:'No fever today'};
}
const tempClass = t => t === null ? 'none' : t >= CRIT ? 'crit' : t >= FEVER ? 'fever' : 'ok';
const patientInRoom = n => S.patients.find(p => p.room === n && live(p));
const roomState = n => patientInRoom(n) ? 'occupied' : (S.cleaning[n] ? 'cleaning' : 'free');
const freeRooms = () => { const a = []; for (let n = 1; n <= ROOMS; n++) if (roomState(n) === 'free') a.push(n); return a; };
const cleaningRooms = () => Object.keys(S.cleaning).map(Number).sort((a, b) => a - b);
const dayIn = p => S.day - p.admitDay + 1;
function logEvent(m, role){ const r = role || UI.role; S.log.unshift({t:nowTime(), day:S.day, m, role:r, user:USERS[r] ? USERS[r].name : 'System'}); S.log = S.log.slice(0, 200); }
function allowed(action){ return PERMS[action].includes(UI.role); }
const rate = () => { const d = S.closed.filter(c => c.outcome === 'deceased').length, n = S.closed.length; return {dead:d, cured:n - d, n, mort:n ? d / n : 0}; };
 
/* temperature validation: returns level, message, and whether an explicit confirmation is needed */
function checkTemp(p, raw, correcting){
  const v = parseFloat(String(raw).replace(',', '.'));
  if (raw === '' || isNaN(v)) return {lvl:'info', msg:'Enter the reading in °C, for example 37.4.', block:true};
  const t = Math.round(v * 10) / 10;
  if (t < MINT || t > MAXT) return {lvl:'err', msg:'A reading of ' + f1(t) + ' °C is outside the possible range (' + f1(MINT) + ' to ' + f1(MAXT) + '). Check the thermometer and enter it again.', block:true, t};
  const prev = (() => { const a = p.readings.filter(r => r.day === S.day - 1 && !r.voided); return a.length ? a[a.length - 1].temp : null; })();
  const sim = p.readings.filter(r => !(r.day === S.day && correcting)).concat([{day:S.day, temp:t}]);
  const after = streakCalc(p, sim, S.day).count;
  let lvl, msg, confirm = null;
  if (t >= CRIT) { lvl = 'err'; msg = 'High fever. The doctor is alerted and this patient moves to the top of the visit queue. Completed fever-free days reset to 0.'; }
  else if (t >= FEVER) { lvl = 'warn'; msg = 'Fever (' + f1(FEVER) + ' °C or above). Completed fever-free days reset to 0.'; }
  else { lvl = 'ok'; msg = 'No fever. Today does not count as a full day until it ends fever-free. Completed fever-free days: ' + Math.min(after, NEED) + ' of ' + NEED + (after >= NEED ? '. This patient can be signed off for discharge.' : '.'); }
  if (t < LOW) { lvl = 'warn'; msg = 'Unusually low reading (below ' + f1(LOW) + ' °C).'; confirm = 'I confirmed the thermometer was placed correctly.'; }
  else if (prev !== null && Math.abs(t - prev) >= 2) { confirm = 'This differs from yesterday (' + f1(prev) + ' °C) by 2 °C or more. I confirm it is correct.'; }
  return {lvl, msg, confirm, t, after, block:false};
}
 
/* actions: each one enforces its own rules and returns {ok, msg} */
function recordTemp(pid, t, opt){
  const p = byId(pid);
  if (!allowed('recordTemp')) return {ok:false, msg:'Only nurses can record temperatures.'};
  if (!p || !(p.status === 'active' || p.status === 'approved')) return {ok:false, msg:'This patient is not on active rounds.'};
  const chk = checkTemp(p, t, opt.correcting);
  if (chk.block) return {ok:false, msg:chk.msg};
  if (chk.confirm && !opt.confirmed) return {ok:false, msg:'Tick the confirmation box to save this reading.'};
  const preCan = canApprove(p);
  const existing = todayReading(p);
  if (existing && !opt.correcting) return {ok:false, msg:'Temperature already recorded today by ' + existing.by + ' at ' + existing.time + '. Use Correct reading if it is wrong.'};
  if (existing && opt.correcting) { if (!opt.reason) return {ok:false, msg:'Choose a reason for the correction.'}; existing.voided = true; existing.voidReason = opt.reason; }
  p.readings.push({day:S.day, time:nowTime(), temp:chk.t, by:USERS.nurse.name, note:opt.note || ''});
  emit('temp'); if (existing) emit('correct');
  if (!preCan && canApprove(p)) emit('becameEligible');
  if (p.status === 'approved' && chk.t >= FEVER) { p.status = 'active'; delete p.approvedDay; logEvent('ALERT: Room ' + p.room + ' fever on re-check, discharge approval cancelled', 'system'); emit('revoked'); }
  logEvent('Room ' + p.room + ' ' + p.name + ': ' + f1(chk.t) + ' °C ' + (existing ? '(corrected)' : 'recorded'));
  if (chk.t >= CRIT) { emit('crit'); logEvent('ALERT: Room ' + p.room + ' high fever ' + f1(chk.t) + ' °C, moved to top of visit queue', 'system'); }
  let msg = 'Saved ' + f1(chk.t) + ' °C for Room ' + p.room + '.';
  return {ok:true, msg, level:chk.t >= CRIT ? 'crit' : ''};
}
function logVisit(pid, d){
  const p = byId(pid);
  if (!allowed('visit')) return {ok:false, msg:'Only doctors can log visits.'};
  if (!p || p.status !== 'active') return {ok:false, msg:'This patient is not on active rounds.'};
  if (visitToday(p)) return {ok:false, msg:'A visit is already logged for today.'};
  const noTemp = todayTemp(p) === null;
  if (noTemp && !d.emergency) return {ok:false, msg:'Temperature not recorded yet. The nurse must record it first, or log an emergency visit with a reason.'};
  if (noTemp && (!d.note || d.note.trim().length < 3)) return {ok:false, msg:'Add a reason for the emergency visit.'};
  if (!d.treatment) return {ok:false, msg:'Choose a treatment plan.'};
  if (d.treatment.startsWith('Other') && (!d.note || d.note.trim().length < 3)) return {ok:false, msg:'Describe the treatment in the note.'};
  p.visits.push({day:S.day, time:nowTime(), by:USERS[UI.role].name, treatment:d.treatment, note:(noTemp ? 'EMERGENCY (no temperature): ' : '') + (d.note || '').trim()});
  logEvent('Room ' + p.room + ' ' + p.name + ': doctor visit logged' + (noTemp ? ' (emergency override)' : ''));
  emit('visit');
  return {ok:true, msg:'Visit logged for Room ' + p.room + '.'};
}
function approveDischarge(pid){
  const p = byId(pid);
  if (!allowed('approve')) return {ok:false, msg:'Only doctors can approve a discharge.'};
  if (!p || !eligible(p)) return {ok:false, msg:'This patient has not completed ' + NEED + ' full fever-free days.'};
  if (todayTemp(p) === null) return {ok:false, msg:'Record today\u2019s temperature first. Sign-off needs a current reading with no fever.'};
  if (!canApprove(p)) return {ok:false, msg:'Fever recorded today. Discharge cannot be approved.'};
  p.eligibleDay = eligSince(p);
  p.status = 'approved'; p.approvedDay = S.day;
  logEvent('Room ' + p.room + ' ' + p.name + ': discharge approved, sent to admin'); emit('approve');
  return {ok:true, msg:'Approved. Admin has Room ' + p.room + ' in the discharge queue.'};
}
function recordDeath(pid, note){
  const p = byId(pid);
  if (!allowed('death')) return {ok:false, msg:'Only doctors can record an outcome.'};
  if (!p || !live(p)) return {ok:false, msg:'This patient is already closed.'};
  if (!note || note.trim().length < 3) return {ok:false, msg:'Add a clinical note before recording the outcome.'};
  p.status = 'deceased'; p.closedDay = S.day;
  S.closed.push({day:S.day, outcome:'deceased', delay:null});
  S.cleaning[p.room] = true;
  logEvent('Room ' + p.room + ' ' + p.name + ': outcome recorded (deceased). Room needs cleaning'); emit('death');
  const r = rate();
  return {ok:true, msg:'Outcome recorded. Mortality is now ' + (r.mort * 100).toFixed(1) + '%.', level:(r.n >= MIN_SAMPLE && r.mort > BENCH) ? 'crit' : ''};
}
function dischargePatient(pid){
  const p = byId(pid);
  if (!allowed('discharge')) return {ok:false, msg:'Only admin staff can discharge patients.'};
  if (!p || p.status !== 'approved') return {ok:false, msg:'A doctor must approve the discharge first.'};
  p.status = 'discharged'; p.closedDay = S.day;
  S.closed.push({day:S.day, outcome:'cured', delay:Math.max(0, S.day - p.eligibleDay)});
  S.cleaning[p.room] = true;
  logEvent('Room ' + p.room + ' ' + p.name + ': discharged. Room needs cleaning'); emit('discharge');
  return {ok:true, msg:'Discharged. Room ' + p.room + ' is waiting to be cleaned.'};
}
function markClean(n){
  if (!allowed('clean')) return {ok:false, msg:'Only admin staff can mark rooms ready.'};
  delete S.cleaning[n];
  logEvent('Room ' + n + ' cleaned and ready'); emit('clean');
  return {ok:true, msg:'Room ' + n + ' is ready for the next patient.'};
}
function admit(d){
  if (!allowed('admit')) return {ok:false, msg:'Only admin staff can admit patients.'};
  if (!d.name || d.name.trim().length < 2) return {ok:false, msg:'Enter the patient name.'};
  const age = parseInt(d.age, 10);
  if (!age || age < 0 || age > 110) return {ok:false, msg:'Enter an age between 0 and 110.'};
  if (d.room === 'wait') {
    S.waiting.push({id:'W' + Date.now(), name:d.name.trim(), age, sex:d.sex, since:nowTime()});
    logEvent(d.name.trim() + ' added to waiting list'); emit('waitadd');
    return {ok:true, msg:'Added to the waiting list.'};
  }
  const room = parseInt(d.room, 10);
  if (roomState(room) !== 'free') return {ok:false, msg:'Room ' + room + ' is not available. Pick a free room.'};
  S.patients.push({id:'P' + Date.now(), name:d.name.trim(), age, sex:d.sex, room, admitDay:S.day, status:'active', readings:[], visits:[]});
  if (d.waitId) S.waiting = S.waiting.filter(w => w.id !== d.waitId);
  logEvent(d.name.trim() + ' admitted to Room ' + room); emit('admit');
  return {ok:true, msg:d.name.trim() + ' admitted to Room ' + room + '. Added to tomorrow-first rounds: temperature due today.'};
}
function advanceDay(){
  const missed = S.patients.filter(p => p.status === 'active' && todayTemp(p) === null).length;
  const unvisited = S.patients.filter(p => p.status === 'active' && !visitToday(p)).length;
  const broken = S.patients.filter(p => p.status === 'active' && todayTemp(p) === null && streak(p) > 0).length;
  S.day++; emit('nextday');
  logEvent('New day started. Yesterday: ' + missed + ' missed temperatures (' + broken + ' fever-free streaks broken), ' + unvisited + ' patients without a visit', 'system');
  return {ok:true, msg:'Day advanced to ' + fmtDate(S.day, {weekday:'short', day:'numeric', month:'short'}) + '. Yesterday: ' + missed + ' missed temperatures, ' + broken + ' fever-free streaks broken.'};
}
 
/* Sprint planning (Q4): exhaustive search over all 2^10 subsets, so the answer is checked, not assumed */
function sprintPlan(){
  const cap = 25 - 3 * 5;
  const W = {High:6, Medium:3, Low:1};   // Low = 1, Medium = 3 x Low, High = 2 x Medium
  const items = [['A','High',1],['B','High',3],['C','High',5],['D','Medium',2],['E','Medium',3],['F','Medium',1],['G','Low',.4],['H','Low',.5],['I','Low',.3],['J','Low',.1]].map(([n,p,e]) => ({n, p, e, v:W[p]}));
  let best = null;
  for (let m = 0; m < 1 << items.length; m++) {
    let e = 0, v = 0;
    items.forEach((it, i) => { if (m >> i & 1) { e += it.e; v += it.v; } });
    e = Math.round(e * 10) / 10;
    if (e > cap + 1e-9) continue;
    if (!best || v > best.v || (v === best.v && e < best.e)) best = {m, e, v};
  }
  items.forEach((it, i) => it.pick = !!(best.m >> i & 1));
  return {cap, items, best};
}
 
 
/* ---------- derived data used by alerts, sparklines and SLA flags ---------- */
/* Day on which the patient became eligible: the day after their 3rd full fever-free day ended. */
function eligSince(p){ const sk = streakCalc(p, p.readings, S.day); return sk.count >= NEED ? S.day - (sk.count - NEED) : null; }
function peaks(p, n){ const a = []; for (let d = S.day - n + 1; d <= S.day; d++) { const r = dayReadings(p, d); a.push(r.length ? Math.max(...r.map(x => x.temp)) : null); } return a; }
function alerts(){
  const out = [], act_ = S.patients.filter(p => p.status === 'active');
  const crit = act_.filter(p => (todayTemp(p) || 0) >= CRIT);
  crit.forEach(p => out.push({k:'crit', t:'High fever in Room ' + p.room, d:p.name + ' · ' + f1(todayTemp(p)) + ' °C', pid:p.id}));
  act_.filter(eligible).forEach(p => { const dl = S.day - eligSince(p); if (dl >= 1) out.push({k:'warn', t:'Sign-off overdue, Room ' + p.room, d:p.name + ' eligible for ' + dl + ' day(s)', pid:p.id}); });
  S.patients.filter(p => p.status === 'approved' && S.day - p.approvedDay >= 1).forEach(p => out.push({k:'warn', t:'Discharge overdue, Room ' + p.room, d:p.name + ' approved ' + (S.day - p.approvedDay) + ' day(s) ago', pid:p.id}));
  const needRead = act_.filter(p => eligible(p) && todayTemp(p) === null).length;
  if (needRead) out.push({k:'warn', t:needRead + ' eligible patient(s) need today\u2019s temperature', d:'Doctors cannot sign off without a current reading', view:'rounds'});
  const cl = cleaningRooms().length;
  if (cl && S.waiting.length) out.push({k:'info', t:cl + ' room(s) waiting to be cleaned', d:S.waiting.length + ' patient(s) are on the waiting list', view:'overview'});
  const r = rate();
  if (r.n >= MIN_SAMPLE && r.mort > BENCH) out.push({k:'crit', t:'Mortality above 15% benchmark', d:(r.mort * 100).toFixed(1) + '% of ' + r.n + ' closed cases', view:'quality'});
  const due = act_.filter(p => todayTemp(p) === null).length;
  if (due) out.push({k:'info', t:due + ' temperature(s) still due today', d:'Nurses see these first in Rounds', view:'rounds'});
  return out;
}

function qualityHTML(){
  const r = rate(), pct = r.mort * 100, ok = 100 - pct;
  const alert = r.n >= MIN_SAMPLE && r.mort > BENCH, near = !alert && r.mort >= BENCH - .02;
  const delays = S.closed.filter(c => c.outcome === 'cured' && c.delay !== null);
  const avgDelay = delays.length ? delays.reduce((s, c) => s + c.delay, 0) / delays.length : 0, late = delays.filter(c => c.delay > 0).length;
  const days = []; for (let d = S.day - 13; d <= S.day; d++) { const sub = S.closed.filter(c => c.day <= d); days.push({d, v:sub.length ? sub.filter(c => c.outcome === 'deceased').length / sub.length * 100 : 0}); }
  const W = 640, H = 220, L = 34, R = 10, T = 12, B = 26, ymax = 25;
  const x = i => L + i * (W - L - R) / (days.length - 1), y = v => T + (1 - v / ymax) * (H - T - B);
  const path = days.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = path + ' L' + x(days.length - 1) + ' ' + y(0) + ' L' + x(0) + ' ' + y(0) + ' Z', last = days[days.length - 1];
  const chart = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cumulative mortality over 14 days against the 15 percent benchmark">' + [0, 5, 10, 15, 20, 25].map(v => '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '%</text>').join('') +
    '<line class="thr" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(15) + '" y2="' + y(15) + '"/><text x="' + (W - R) + '" y="' + (y(15) - 5) + '" text-anchor="end" style="fill:var(--warn)">15% benchmark</text><path class="area" d="' + area + '"/><path class="ln" d="' + path + '"/>' +
    days.filter((p, i) => i % 3 === 0 || i === days.length - 1).map(p => '<text x="' + x(days.indexOf(p)) + '" y="' + (H - 8) + '" text-anchor="middle">' + fmtDate(p.d) + '</text>').join('') +
    '<circle class="dot ' + (last.v > 15 ? 'c' : '') + '" cx="' + x(days.length - 1) + '" cy="' + y(last.v) + '" r="5"/><text x="' + (x(days.length - 1) - 8) + '" y="' + (y(last.v) - 9) + '" text-anchor="end" style="fill:var(--ink);font-weight:600">' + last.v.toFixed(1) + '%</text></svg>';
  return pagehead('Treatment quality', 'Mortality among closed cases (discharged cured or deceased) against the 85% success benchmark.') +
    (alert ? '<div class="banner crit"><div><b>Mortality is above the 15% benchmark</b><span>' + pct.toFixed(1) + '% across ' + r.n + ' closed cases (' + r.dead + ' deaths). Review treatment protocols and staffing.</span></div></div>' : near ? '<div class="banner warn"><div><b>Approaching the 15% benchmark</b><span>' + pct.toFixed(1) + '% across ' + r.n + ' closed cases. One more death puts the centre over the line.</span></div></div>' : '<div class="banner ok"><div><b>Within benchmark</b><span>' + pct.toFixed(1) + '% mortality across ' + r.n + ' closed cases.</span></div></div>') +
    '<div class="kpis">' + kpi(alert ? 'crit' : 'ok', 'Mortality (benchmark 15%)', pct.toFixed(1) + '%') + kpi(ok >= 85 ? 'ok' : 'crit', 'Success rate (benchmark 85%)', ok.toFixed(1) + '%') + kpi('', 'Closed cases', r.n) + kpi(avgDelay > .5 ? 'warn' : 'ok', 'Avg extra days after eligible', avgDelay.toFixed(1)) + kpi('', 'Discharges held up', late + '<small class="mono"> / ' + delays.length + '</small>') + '</div>' +
    '<div class="grid2"><section class="panel"><h3>Cumulative mortality, last 14 days</h3>' + chart + '<p class="muted" style="margin-top:6px;font-size:13px">Alerts fire once at least ' + MIN_SAMPLE + ' cases are closed, so one early death does not trigger a false alarm.</p></section>' +
    '<section class="panel"><h3>How the numbers are worked out</h3><ul class="rules"><li>Mortality = deaths ÷ (deaths + cured discharges). Patients still in a room are not counted.</li><li>Success rate = 100% minus mortality.</li><li>Extra days = days between becoming eligible (the day after the 3rd full fever-free day ended) and the actual discharge. It exposes sign-off and admin delays.</li><li>The 15% benchmark and every clinical threshold are assumptions that need head doctor approval (see Assumptions).</li><li>Try it: as Doctor, record a death for any patient, then return here.</li></ul></section></div>';
}

function swimHTML(){
  const lanes = ['Nurse', 'System', 'Doctor', 'Admin', 'Head Doctor'], LH = 84, LX = 100, W = 1060, H = lanes.length * LH + 8, bw = 138, bh = 50;
  const cx = i => LX + 14 + i * 160, cy = l => 4 + l * LH + (LH - bh) / 2;
  const B = {
    n1:{c:0, l:0, t:['Record temperature', 'Locked after saving'], k:''}, s2:{c:1, l:1, t:['Validate and lock', 'Update daily record'], k:'sys'}, d3:{c:2, l:2, t:['Visit unlocks', 'Log visit and treatment'], k:''},
    s4:{c:3, l:1, t:['3 full fever-free days?', 'Flag as eligible'], k:'sys'}, d5:{c:4, l:2, t:['Approve discharge', 'One tap'], k:''}, a5:{c:4, l:3, t:['Discharge', 'Room goes to cleaning'], k:'good'},
    a6:{c:5, l:3, t:['Mark room ready', 'Admit from waiting list'], k:''}, h6:{c:5, l:4, t:['Mortality and delay', 'metrics, alerts'], k:'sys'}, d7:{c:3, l:2, t:['Record death', 'Note required'], k:'bad'}
  };
  const bx = id => { const b = B[id]; return {x:cx(b.c), y:cy(b.l)}; };
  const ar = (a, b, dash) => { const A = bx(a), Bb = bx(b);
    let d; if (A.x === Bb.x) { const y1 = A.y < Bb.y ? A.y + bh : A.y, y2 = A.y < Bb.y ? Bb.y : Bb.y + bh; d = 'M' + (A.x + bw / 2) + ' ' + y1 + ' V' + y2; }
    else if (A.y === Bb.y) d = 'M' + (A.x + bw) + ' ' + (A.y + bh / 2) + ' H' + Bb.x;
